[project]
name = "call-me-maybe"
version = "1.0.0"
description = "LLM Function Calling with Constrained Decoding"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "numpy",
    "torch",
    "transformers",
    "mypy",
    "flake8",
    "huggingface_hub"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
